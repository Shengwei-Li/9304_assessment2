<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hydrofoil SIL View</title>
<style>
  :root {
    --bg: #f5f5f3; --panel: #ffffff; --ink: #1f2328; --muted: #6b7078; --faint: #b9bdc3; --line: #e3e4e6;
    --accent: #c2410c;                 /* controller: estimate, computing time */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
         display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: minmax(0, 1fr) auto; height: 100vh; }
  #view { position: relative; grid-row: 1; grid-column: 1; min-height: 0; background: #c9d6e0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #msg { position: absolute; left: 14px; bottom: 12px; color: #fff; font-size: 13px; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
  #side { grid-row: 1; grid-column: 2; background: var(--panel); border-left: 1px solid var(--line);
          display: flex; flex-direction: column; min-height: 0; padding: 12px 14px 8px; gap: 6px; }
  #state { display: grid; grid-template-columns: auto 1fr; gap: 1px 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  #state .t { grid-column: 1 / 3; font-size: 22px; font-variant-numeric: tabular-nums; margin-bottom: 2px; }
  #state .mode { grid-column: 1 / 3; color: var(--muted); margin-bottom: 4px; }
  #state span { color: var(--muted); }
  #state b { font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }
  .plot { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  .plot h3 { margin: 6px 0 0; font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .plot h3 small { font-weight: 400; color: var(--muted); white-space: nowrap; }
  .sw { display: inline-block; width: 12px; height: 0; border-top: 2px solid; vertical-align: middle; margin: 0 3px 0 8px; }
  .sw.dot { width: 4px; height: 4px; border: 0; border-radius: 50%; }
  .sw.dash { border-top-style: dashed; }
  .plot canvas { flex: 1; min-height: 0; width: 100%; }
  #bar { grid-row: 2; grid-column: 1 / 3; background: var(--panel); border-top: 1px solid var(--line);
         display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 8px 14px; }
  .grp { display: flex; align-items: center; gap: 2px; }
  .grp > label { color: var(--muted); margin-right: 6px; }
  button, select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
                   border-radius: 3px; padding: 2px 9px; cursor: pointer; }
  button.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  button:disabled { color: var(--faint); cursor: default; }
  #scrub { flex: 1 1 200px; min-width: 140px; accent-color: var(--ink); }
  #conn { color: var(--muted); }
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: 55vh auto auto; height: auto; }
    #side { grid-row: 2; grid-column: 1; border-left: 0; border-top: 1px solid var(--line); }
    .plot { flex: none; height: 130px; }
    #bar { grid-row: 3; grid-column: 1; }
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view">
  <div id="msg">Connecting to sil_bridge.py</div>
</div>

<div id="side">
  <div id="state">
    <div class="t" id="s-t">t = 0.00 s</div>
    <div class="mode" id="s-mode">no data</div>
    <span>height error</span><b id="s-e">–</b>
    <span>pitch</span><b id="s-th">–</b>
    <span>foils front / rear</span><b id="s-d">–</b>
    <span>late replies</span><b id="s-late">–</b>
    <span>behind real time</span><b id="s-lag">–</b>
  </div>
  <div class="plot"><h3>Height (cm) <small><i class="sw dot" style="background:var(--faint)"></i>sensor<i class="sw" style="color:var(--ink)"></i>true<i class="sw" style="color:var(--accent)"></i>estimate<i class="sw dash" style="color:var(--muted)"></i>target</small></h3><canvas id="p-h"></canvas></div>
  <div class="plot"><h3>Pitch (deg) <small><i class="sw dot" style="background:var(--faint)"></i>AHRS<i class="sw" style="color:var(--ink)"></i>true<i class="sw" style="color:var(--accent)"></i>estimate</small></h3><canvas id="p-th"></canvas></div>
  <div class="plot"><h3>Foil angle (deg) <small><i class="sw" style="color:var(--ink)"></i>front<i class="sw" style="color:var(--muted)"></i>rear · thin: command</small></h3><canvas id="p-d"></canvas></div>
  <div class="plot"><h3>Controller timing (ms) <small><i class="sw" style="color:var(--accent)"></i>computing<i class="sw" style="color:var(--faint)"></i>round trip</small></h3><canvas id="p-link"></canvas></div>
</div>

<div id="bar">
  <div class="grp"><span id="conn">Bridge: offline</span></div>
  <div class="grp"><label>Source</label><button id="b-live" class="on">Live</button>
    <select id="rec-list"><option value="">Recorded runs</option></select>
    <button id="b-file">Open .bin</button><input id="file" type="file" accept=".bin" hidden></div>
  <div class="grp"><button id="b-play" disabled>Pause</button></div>
  <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" disabled>
  <div class="grp"><label>Speed</label>
    <button data-speed="0.1">0.1×</button><button data-speed="0.25">0.25×</button><button data-speed="0.5">0.5×</button><button data-speed="1" class="on">1×</button></div>
  <div class="grp"><label>View</label>
    <button data-view="side" class="on">Side</button><button data-view="quarter">3/4</button><button data-view="chase">Chase</button><button data-view="bow">Bow</button><button data-view="under">Underwater</button></div>
  <div class="grp"><label>Motion</label><button data-exag="1" class="on">1×</button><button data-exag="3">3×</button><button data-exag="10">10×</button></div>
  <div class="grp"><button id="b-ghost" class="on">Estimate</button><button id="b-beam" class="on">Sensor</button></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
